    summary: {en: "Industrial designer and futurist who originated The Venus Project and its social-design programme.", ru: "Промышленный дизайнер и футуролог, создавший «Проект Венера» и его программу социального проектирования.", uk: "Промисловий дизайнер і футуролог, який створив «Проєкт Венера» та його програму соціального проєктування."}
    proposal: {en: "Redesign settlements and production around resources, science, automation, and long-term planning.", ru: "Перестроить поселения и производство вокруг ресурсов, науки, автоматизации и долгосрочного планирования.", uk: "Перебудувати поселення й виробництво навколо ресурсів, науки, автоматизації та довгострокового планування."}
    caveat: {en: "His broad vision did not specify a complete transition, constitutional order, or accountability system. Current organisational status belongs to The Venus Project and its separate governing bodies.", ru: "Его широкое видение не задавало полного перехода, конституционного устройства или системы подотчётности. Текущий статус организации относится к «Проекту Венера» и его отдельным органам управления.", uk: "Його широке бачення не задавало повного переходу, конституційного устрою чи системи підзвітності. Поточний статус організації належить «Проєкту Венера» та його окремим органам управління."}
    links:
      - {label: Official history, url: "https://www.thevenusproject.com/about/history/"}

